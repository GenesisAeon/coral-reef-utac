[project]
name = "coral-reef-utac"
version = "1.3.0"
description = "NOAA Coral Reef Watch's real Degree Heating Week threshold system (Hughes et al. 2017/2018, NOAA 2024: escalating global bleaching events 21%->37%->68%->83.7% of reef area), real thermal-acidification synergy (Guillermic et al. 2021), and Walker et al. 2023 (the honesty check: bleaching resistance varies by genotype with real fitness tradeoffs), no UTAC/CREP bridge"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Römer, Johann" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/GenesisAeon/coral-reef-utac"
Repository = "https://github.com/GenesisAeon/coral-reef-utac"

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coral_reef_utac"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=coral_reef_utac --cov-report=term-missing -v"
